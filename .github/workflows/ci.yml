name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the version pinned in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build example SPAs
        run: |
          pnpm --filter @comp/example-blog-d1 build:client
          pnpm --filter @comp/example-shop-d1 build:client

      # Reads the SPAs built above, so it has to follow them. Effect is a
      # server-side dependency; only tree-shaking keeps it out of the browser
      # bundle, and that is a bundler's choice rather than a guarantee.
      - name: Bundle isolation
        run: pnpm check:bundle
